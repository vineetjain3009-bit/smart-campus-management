{% extends 'base.html' %}
{% block content %}
<section class="page-heading"><span class="eyebrow">COURSEWORK</span><h1>{{ title }}</h1><p>Give students and faculty a clear record of what is due and when.</p></section>
<form class="panel form-panel" method="post" action="{{ form_action }}"><div class="form-grid"><label class="span-two">Assignment title<input name="title" value="{{ assignment.title if assignment else '' }}" placeholder="e.g. Graph Traversal Lab" required></label><label>Subject<select name="subject" required><option value="">Choose subject</option>{% for subject in subjects %}<option value="{{ subject }}" {% if assignment and assignment.subject == subject %}selected{% endif %}>{{ subject }}</option>{% endfor %}</select></label><label>Status<select name="status" required>{% for status in ['Pending', 'Submitted', 'Overdue'] %}<option value="{{ status }}" {% if assignment and assignment.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Assigned date<input type="date" name="assigned_date" value="{{ assignment.assigned_date if assignment else today }}" required></label><label>Due date<input type="date" name="due_date" value="{{ assignment.due_date if assignment else '' }}" required></label><label class="span-two">Description<textarea name="description" rows="5" placeholder="Briefly describe the coursework and expected output." required>{{ assignment.description if assignment else '' }}</textarea></label></div><div class="form-actions"><a class="button button-secondary" href="{{ url_for('assignments') }}">Cancel</a><button class="button button-primary" type="submit">Save assignment</button></div></form>
{% endblock %}
