{% extends 'base.html' %}
{% block content %}
<section class="page-heading"><span class="eyebrow">STUDENT RECORD</span><h1>{{ title }}</h1><p>Keep information accurate and easy for your team to find.</p></section>
<form class="panel form-panel" method="post" action="{{ form_action }}"><div class="form-grid"><label>Student ID<input name="student_id" value="{{ student.student_id if student else '' }}" placeholder="e.g. CS2024010" required></label><label>Full name<input name="name" value="{{ student.name if student else '' }}" placeholder="Student's full name" required></label><label>Email address<input type="email" name="email" value="{{ student.email if student else '' }}" placeholder="name@campus.edu" required></label><label>Phone number<input name="phone" value="{{ student.phone if student else '' }}" placeholder="+91 98765 00000" required></label><label>Department<select name="department" required><option value="">Choose department</option>{% for department in departments %}<option value="{{ department }}" {% if student and student.department == department %}selected{% endif %}>{{ department }}</option>{% endfor %}</select></label><label>Semester<select name="semester" required><option value="">Choose semester</option>{% for value in range(1, 9) %}<option value="{{ value }}" {% if student and student.semester|int == value %}selected{% endif %}>Semester {{ value }}</option>{% endfor %}</select></label></div><div class="form-actions"><a class="button button-secondary" href="{{ url_for('students') }}">Cancel</a><button class="button button-primary" type="submit">Save student</button></div></form>
{% endblock %}
