{% extends 'base.html' %}
{% block content %}
<section class="page-heading"><span class="eyebrow">CAMPUS CALENDAR</span><h1>{{ title }}</h1><p>Share the essentials so everyone knows where to be and when.</p></section>
<form class="panel form-panel" method="post" action="{{ form_action }}"><div class="form-grid"><label class="span-two">Event name<input name="name" value="{{ event.name if event else '' }}" placeholder="e.g. Innovation Showcase" required></label><label>Date<input type="date" name="event_date" value="{{ event.event_date if event else today }}" required></label><label>Time<input type="time" name="event_time" value="{{ event.event_time if event else '' }}" required></label><label>Venue<input name="venue" value="{{ event.venue if event else '' }}" placeholder="e.g. Main Auditorium" required></label><label>Organizer<input name="organizer" value="{{ event.organizer if event else '' }}" placeholder="e.g. Innovation Cell" required></label><label class="span-two">Description<textarea name="description" rows="5" placeholder="A clear, useful overview of the event." required>{{ event.description if event else '' }}</textarea></label></div><div class="form-actions"><a class="button button-secondary" href="{{ url_for('events') }}">Cancel</a><button class="button button-primary" type="submit">Save event</button></div></form>
{% endblock %}
